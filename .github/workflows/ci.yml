name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Lint, Type-Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-Check & Build
        run: npm run build

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    name: Backend — Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov anyio httpx

      - name: Run backend tests
        env:
          ENVIRONMENT: test
          GEMINI_API_KEY: mock_key
          GOOGLE_API_KEY: mock_key
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: mock_key
          SUPABASE_SERVICE_ROLE_KEY: mock_key
        run: |
          PYTHONPATH=. pytest ../tests/ -v -k "not test_chat"
